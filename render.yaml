services:
  - type: web
    name: hackfusion-ai-verifier
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CRITIC_MODEL
        value: gemini-2.0-flash
      - key: PRIMARY_MODEL
        value: llama-3.3-70b-versatile
      - key: FAST_MODEL
        value: llama-3.1-8b-instant
      - key: MAX_VERIFICATION_LOOPS
        value: "3"
      - key: VITE_API_URL
        value: https://multi-ai-agent-model.onrender.com
