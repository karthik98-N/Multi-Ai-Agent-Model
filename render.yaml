services:
  - type: web
    name: hackfusion-ai-verifier
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CRITIC_MODEL
        value: gemini-2.5-flash
      - key: PRIMARY_MODEL
        value: llama-3.3-70b-versatile
      - key: FAST_MODEL
        value: llama-3.3-70b-versatile
      - key: TURBO_MODEL
        value: llama3-8b-8192
      - key: MAX_VERIFICATION_LOOPS
        value: "3"
